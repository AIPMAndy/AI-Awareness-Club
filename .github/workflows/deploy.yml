name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build pages
        run: python scripts/build.py
      - name: Validate
        run: python -m unittest discover -s tests -v
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public site after deployment
        shell: bash
        run: |
          set -euo pipefail
          base="${{ steps.deployment.outputs.page_url }}"
          base="${base%/}/"
          for path in "" "library/" "guides/ai-first-week/" "sitemap.xml" "llms.txt"; do
            echo "Checking ${base}${path}"
            curl --fail --location --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 --max-time 20 "${base}${path}" -o /tmp/ai-awareness-page
            test -s /tmp/ai-awareness-page
            if [[ -z "${path}" ]]; then
              grep -q 'AI Awareness Club' /tmp/ai-awareness-page
            fi
          done
