name: Check content and website
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild static site
        run: python scripts/build.py
      - name: Install PDF renderer and Chinese fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          python -m pip install -r scripts/pdf-requirements.txt
      - name: Generate and verify full PDF
        run: |
          python scripts/build_pdf.py
          python scripts/check_pdf.py
          mkdir -p docs/pdf
          cp pdf/ai-awareness-club-guide.pdf docs/pdf/ai-awareness-club-guide.pdf
      - name: Unit and content tests
        run: python -m unittest discover -s tests -v
      - name: Validate client JavaScript syntax
        run: |
          node --check site/assets/app.js
          node --check docs/assets/app.js
      - name: Verify committed output is reproducible
        run: git diff --exit-code -- docs
