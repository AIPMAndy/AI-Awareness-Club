<text x="326" y="175" text-anchor="middle">01 / PRACTICE</text><text x="186" y="402" transform="rotate(-55 186 402)">02 / CLARITY</text><text x="430" y="445" transform="rotate(51 430 445)">03 / TOGETHER</text>
