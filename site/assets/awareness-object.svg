<text x="330" y="362" text-anchor="middle" font-size="48" font-family="Georgia,serif" font-weight="bold" fill="#214C3E">AI</text>
<text x="330" y="385" text-anchor="middle" font-size="10" font-family="Arial,sans-serif" letter-spacing="3" fill="#547E65">AWAKENING</text>
