<linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFFDF5"/><stop offset="1" stop-color="#EEEDE4"/></linearGradient>
<filter id="sh" x="-60%" y="-60%" width="220%" height="220%"><feDropShadow dx="0" dy="28" stdDeviation="24" flood-color="#15372D" flood-opacity=".18"/></filter>
