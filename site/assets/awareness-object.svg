<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 660" role="img" aria-labelledby="title desc">
<title id="title">AI 醒觉社 · Layers of Awareness</title><desc id="desc">Original forest-green knowledge atlas with three orbital layers representing skills, clarity and co-creation.</desc>
<defs>
<radialGradient id="bg"><stop stop-color="#F8FBF5"/><stop offset="1" stop-color="#E2EBDF"/></radialGradient>
