<circle cx="330" cy="325" r="196" fill="url(#deep)"/>
<circle cx="330" cy="325" r="170" fill="none" stroke="#9BC0A3" stroke-opacity=".44" stroke-width="1"/>
<circle cx="330" cy="325" r="144" fill="none" stroke="#BCD6BE" stroke-opacity=".47" stroke-width="1"/>
