<g font-family="Arial, sans-serif" fill="#315F52"><text x="58" y="173" font-size="10" font-weight="700" letter-spacing="2">01 / LEARN</text><text x="58" y="197" font-size="15" font-weight="600">Build real skills</text><text x="470" y="439" font-size="10" font-weight="700" letter-spacing="2">03 / CREATE</text><text x="470" y="466" font-size="15" font-weight="600">Connect &amp; grow</text></g>
