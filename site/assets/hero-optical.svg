<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="660" viewBox="0 0 1380 660" role="img" aria-labelledby="title desc">
<title id="title">AI 醒觉社原创光学景观</title><desc id="desc">由三条半透明金属光轨和中心玻璃球构成，象征实践、觉察与共创。</desc>
<defs>
<radialGradient id="space" cx=".5" cy=".39" r=".56"><stop stop-color="#184738"/><stop offset=".55" stop-color="#0a241b"/><stop offset="1" stop-color="#050807"/></radialGradient>
<radialGradient id="aura" cx=".5" cy=".5" r=".5"><stop stop-color="#72f2b6" stop-opacity=".49"/><stop offset=".5" stop-color="#3baf7b" stop-opacity=".23"/><stop offset="1" stop-color="#0d291d" stop-opacity="0"/></radialGradient>
<radialGradient id="glass" cx=".29" cy=".2" r=".8"><stop stop-color="#f8fff9"/><stop offset=".11" stop-color="#bff4d9"/><stop offset=".28" stop-color="#60c29b"/><stop offset=".48" stop-color="#1d7759"/><stop offset=".73" stop-color="#0c392a"/><stop offset=".88" stop-color="#2c8866"/><stop offset="1" stop-color="#9fe7bf"/></radialGradient>
<radialGradient id="inner" cx=".3" cy=".22" r=".9"><stop stop-color="#f2fff5" stop-opacity=".94"/><stop offset=".2" stop-color="#a9edd0" stop-opacity=".82"/><stop offset=".52" stop-color="#2d906c" stop-opacity=".61"/><stop offset=".8" stop-color="#104532" stop-opacity=".52"/><stop offset="1" stop-color="#0c3022" stop-opacity=".68"/></radialGradient>
<linearGradient id="chrome" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#ffffff"/><stop offset=".15" stop-color="#e1ffeb"/><stop offset=".31" stop-color="#8ac7a6"/><stop offset=".5" stop-color="#1e644b"/><stop offset=".69" stop-color="#7cb998"/><stop offset=".83" stop-color="#effff3"/><stop offset="1" stop-color="#6caf86"/></linearGradient>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#effff8" stop-opacity=".93"/><stop offset=".23" stop-color="#65ab90" stop-opacity=".5"/><stop offset=".5" stop-color="#103e2b" stop-opacity=".17"/><stop offset=".77" stop-color="#e6fff2" stop-opacity=".8"/><stop offset="1" stop-color="#5e977b" stop-opacity=".35"/></linearGradient>
<filter id="blur"><feGaussianBlur stdDeviation="31"/></filter>
<filter id="glow"><feGaussianBlur stdDeviation="6"/></filter>
<filter id="shadow" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="33" stdDeviation="26" flood-color="#000" flood-opacity=".65"/></filter>
</defs>
<rect width="1380" height="660" fill="url(#space)"/>
<ellipse cx="690" cy="280" rx="530" ry="350" fill="url(#aura)" filter="url(#blur)"/>
<ellipse cx="690" cy="601" rx="315" ry="24" fill="#0b0f0b" opacity=".78" filter="url(#blur)"/>
