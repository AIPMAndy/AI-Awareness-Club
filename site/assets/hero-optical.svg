<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="660" viewBox="0 0 1380 660" role="img" aria-labelledby="title desc">
<title id="title">AI 醒觉社原创光学景观</title><desc id="desc">由三条半透明金属光轨和中心玻璃球构成，象征实践、觉察与共创。</desc>
<defs>
<radialGradient id="space" cx=".5" cy=".39" r=".48"><stop stop-color="#163b31"/><stop offset=".52" stop-color="#091711"/><stop offset="1" stop-color="#050807"/></radialGradient>
<radialGradient id="aura" cx=".5" cy=".5" r=".5"><stop stop-color="#72f2b6" stop-opacity=".27"/><stop offset=".5" stop-color="#3baf7b" stop-opacity=".095"/><stop offset="1" stop-color="#0d291d" stop-opacity="0"/></radialGradient>
<radialGradient id="glass" cx=".29" cy=".2" r=".8"><stop stop-color="#e9fff7" stop-opacity=".98"/><stop offset=".09" stop-color="#a5f6d1" stop-opacity=".9"/><stop offset=".23" stop-color="#2a9a78" stop-opacity=".82"/><stop offset=".44" stop-color="#0d4035"/><stop offset=".7" stop-color="#082019"/><stop offset=".87" stop-color="#144a38"/><stop offset="1" stop-color="#a4f5d2"/></radialGradient>
<radialGradient id="inner" cx=".3" cy=".2"><stop stop-color="#f7fff5" stop-opacity=".95"/><stop offset=".14" stop-color="#ccfbe0" stop-opacity=".69"/><stop offset=".55" stop-color="#30765a" stop-opacity=".2"/><stop offset="1" stop-color="#06180f" stop-opacity=".55"/></radialGradient>
<linearGradient id="chrome" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#ecfff0"/><stop offset=".15" stop-color="#a0ccb3"/><stop offset=".31" stop-color="#2d5f4d"/><stop offset=".5" stop-color="#091b17"/><stop offset=".69" stop-color="#38755d"/><stop offset=".83" stop-color="#c0f5d4"/><stop offset="1" stop-color="#325346"/></linearGradient>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#effff8" stop-opacity=".93"/><stop offset=".23" stop-color="#65ab90" stop-opacity=".5"/><stop offset=".5" stop-color="#103e2b" stop-opacity=".17"/><stop offset=".77" stop-color="#e6fff2" stop-opacity=".8"/><stop offset="1" stop-color="#5e977b" stop-opacity=".35"/></linearGradient>
<filter id="blur"><feGaussianBlur stdDeviation="31"/></filter>
<filter id="glow"><feGaussianBlur stdDeviation="6"/></filter>
<filter id="shadow" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="33" stdDeviation="26" flood-color="#000" flood-opacity=".65"/></filter>
</defs>
<rect width="1380" height="660" fill="url(#space)"/>
<ellipse cx="690" cy="280" rx="530" ry="350" fill="url(#aura)" filter="url(#blur)"/>
<ellipse cx="690" cy="601" rx="315" ry="24" fill="#0b0f0b" opacity=".78" filter="url(#blur)"/>
<!-- floating machined loops -->
<g filter="url(#shadow)" fill="none" stroke-linecap="round">
<ellipse cx="690" cy="290" rx="460" ry="160" transform="rotate(-23 690 290)" stroke="url(#chrome)" stroke-width="34" opacity=".69"/>
<ellipse cx="690" cy="290" rx="460" ry="160" transform="rotate(-23 690 290)" stroke="url(#edge)" stroke-width="11"/>
<ellipse cx="690" cy="290" rx="425" ry="148" transform="rotate(29 690 290)" stroke="url(#chrome)" stroke-width="19" opacity=".63"/>
<ellipse cx="690" cy="290" rx="425" ry="148" transform="rotate(29 690 290)" stroke="url(#edge)" stroke-width="4" opacity=".8"/>
</g>
<g filter="url(#shadow)">
<circle cx="690" cy="286" r="199" fill="url(#glass)" stroke="#80cbaa" stroke-opacity=".37" stroke-width="2"/>
<circle cx="690" cy="286" r="171" fill="url(#inner)" stroke="#e6fff3" stroke-opacity=".21" stroke-width="1.5"/>
<circle cx="690" cy="286" r="160" fill="none" stroke="#a0dbb5" stroke-opacity=".15"/>
<ellipse cx="615" cy="199" rx="49" ry="28" fill="#e3fff1" opacity=".32" transform="rotate(-33 615 199)" filter="url(#glow)"/>
<path d="M548 205C581 132 664 91 748 111" stroke="#fff" stroke-opacity=".73" stroke-width="4.5" fill="none" stroke-linecap="round"/>
<path d="M789 444C849 411 883 367 886 311" stroke="#d7fff0" stroke-opacity=".62" stroke-width="3.4" fill="none" stroke-linecap="round"/>
</g>
<!-- foreground glass rim; slight chromatic separation as on polished optical glass -->
<path d="M365 467C495 576 906 524 1037 346" fill="none" stroke="#ebfff2" stroke-opacity=".2" stroke-width="1"/>
<path d="M293 356C421 487 906 554 1080 270" fill="none" stroke="#d3fcec" stroke-opacity=".11" stroke-width="2"/>
